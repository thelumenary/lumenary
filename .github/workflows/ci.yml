name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # Mathlib's prebuilt files (~7 GB) plus a static export of every page in six locales do
      # not fit in the runner's default free space; remove toolchains this project never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The same interpreter version as Pyodide 0.29.3, which runs the experiments in the browser.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python environment
        run: |
          python -m venv compute/.venv
          compute/.venv/bin/pip install -r compute/requirements.txt

      # Mathlib's prebuilt files are large; cache them between runs, keyed on the pinned versions.
      # (The source globs exclude formal/.lake, which exists only after the restore.)
      - name: Restore Lean packages and build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/.lake/packages
            formal/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-${{ hashFiles('formal/*.lean', 'formal/Lumenary/**/*.lean', 'formal/LumenaryExercises/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-

      - name: Fetch prebuilt Mathlib
        working-directory: formal
        run: lake exe cache get

      - name: Compile Lean library and write verification report
        run: npm run verify:lean

      - name: Save Lean packages and build
        if: steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/.lake/packages
            formal/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-${{ hashFiles('formal/*.lean', 'formal/Lumenary/**/*.lean', 'formal/LumenaryExercises/**/*.lean') }}

      # The site build does not need Lean; reclaim the space before exporting thousands of pages.
      - name: Remove Lean packages
        run: rm -rf formal/.lake && df -h /

      - name: Run and test computational experiments
        run: npm run verify:compute

      - name: Typecheck
        run: npm run typecheck

      - name: Content, lesson, widget, registry and i18n tests
        run: npm test

      - name: Build static site
        run: npm run build

      # Deployment: the Vercel project is connected to this repository, so Vercel builds and
      # deploys every push to main (production) and every pull request (preview).
