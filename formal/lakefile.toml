# The Lumenary — formal mathematics (Lean 4, core library only; no Mathlib yet).
#
#   lake build                               # builds both libraries
#   lake build Lumenary LumenaryExercises    # what scripts/verify-lean.mjs runs
#
# `Lumenary` holds the checked library: every declaration must compile without `sorry`.
# `LumenaryExercises` holds learner exercises: statements with `sorry` placeholders whose
# solutions live in `Lumenary`.

name = "lumenary"
version = "0.1.0"
defaultTargets = ["Lumenary", "LumenaryExercises"]

[leanOptions]
# Every variable must be declared explicitly — clearer for learners, and Mathlib's convention.
autoImplicit = false

[[lean_lib]]
name = "Lumenary"

[[lean_lib]]
name = "LumenaryExercises"
