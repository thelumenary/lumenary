# The Lumenary — formal mathematics (Lean 4 + Mathlib).
#
#   lake build                               # builds both libraries
#   lake build Lumenary LumenaryExercises    # what scripts/verify-lean.mjs runs
#
# `Lumenary` holds the checked library: every declaration must compile without `sorry`.
# `LumenaryExercises` holds learner exercises: statements with `sorry` placeholders whose
# solutions live in `Lumenary`.

name = "lumenary"
version = "0.1.0"
defaultTargets = ["Lumenary", "LumenaryExercises"]

# Mathlib is pinned to the release tag matching `lean-toolchain`. Elementary modules
# (Collections … Category) still use core Lean only, so learners can read them without
# Mathlib; modules for later levels import the parts of Mathlib they need.
# Fetch prebuilt Mathlib files with `lake exe cache get` before the first build.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[leanOptions]
# Every variable must be declared explicitly — clearer for learners, and Mathlib's convention.
autoImplicit = false

# Every module under Lumenary/ and LumenaryExercises/ belongs to its library, so a new lesson
# module is built (and can be built on its own: `lake build Lumenary.Topology`) without editing
# an index file.
[[lean_lib]]
name = "Lumenary"
globs = ["Lumenary.*"]

[[lean_lib]]
name = "LumenaryExercises"
globs = ["LumenaryExercises.*"]
